[package]
name = "avatar-godot"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The Avatar Workshop evaluation core as a Godot extension"

[lib]
crate-type = ["cdylib"]

[dependencies]
avatar-core = { path = "../avatar-core" }
godot = { version = "0.5.5", features = ["api-4-6", "experimental-threads"] }
glam = "0.34"
serde_json = "1"

[profile.release]
lto = "thin"

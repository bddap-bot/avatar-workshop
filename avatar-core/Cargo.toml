[package]
name = "avatar-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The Avatar Workshop avatar model: its types, the .glb reader and writer, and the JSON schema"

[dependencies]
# libm: every runtime computes the same bits, whatever math library its platform ships.
glam = { version = "0.34", features = ["libm"] }
libm = "0.2"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
flate2 = "1.1.10"
